name: Showcase CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build obfuscated bundle
        run: bash scripts/build-showcase.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: showcase-dist
          path: dist