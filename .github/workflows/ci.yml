name: Showcase CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build obfuscated bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          npx --yes html-minifier-terser \
            index.html \
            -o dist/index.html \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --minify-css true \
            --minify-js true
          cp -R projects dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: showcase-dist
          path: dist